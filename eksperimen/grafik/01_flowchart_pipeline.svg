/text><text x='938' y='338' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>'murni' = skor inlier saja</text><text x='938' y='355' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>RRF jauh lebih buruk di sini</text><text x='938' y='408' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#15803d' text-anchor='start' font-weight='600' xml:space='preserve'>Rank-1 75,60%</text><rect x='24' y='452' width='1132' height='74' rx='10' fill='#f0fdf4' stroke='#15803d' stroke-width='2'/><text x='44' y='480' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#15803d' text-anchor='start' font-weight='700' xml:space='preserve'>HASIL AKHIR</text><text x='44' y='506' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#1b1b1b' text-anchor='start' font-weight='700' xml:space='preserve'>Rank-1 75.60%</text><text x='210' y='506' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>Rank-5 85.12%</text><text x='372' y='506' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>mAP 80.19%</text><text x='510' y='506' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>n = 168, ReunionTurtles</text><text x='730' y='506' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#15803d' text-anchor='start' font-weight='700' xml:space='preserve'>+50,60 poin di atas stage-1</text><text x='960' y='506' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#15803d' text-anchor='start' font-weight='600' xml:space='preserve'>p = 1,0e-22</text><text x='24' y='556' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>Kenapa dua tahap: MegaDescriptor cepat tapi kasar (25%); XFeat teliti tapi lambat (15 ms/pasangan).</text><text x='24' y='574' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>Tahap 1 memangkas 84 kandidat jadi daftar pendek, tahap 2 memeriksa sisik satu per satu.</text><text x='24' y='596' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#b91c1c' text-anchor='start' font-weight='600' xml:space='preserve'>Angka dari ReunionTurtles, 168 query. Belum direplikasi di dataset kedua.</text></svg>
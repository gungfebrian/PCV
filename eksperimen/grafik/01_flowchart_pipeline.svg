serve'>bukan demi resolusi</text><text x='38' y='408' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#ea580c' text-anchor='start' font-weight='600' xml:space='preserve'>efeknya mendatar di 448-512</text><path d='M 280 356 L 320 356' stroke='#6b6b6b' stroke-width='2' fill='none' marker-end='url(#p)'/><rect x='324' y='292' width='252' height='128' rx='10' fill='#ffffff' stroke='#7c3aed' stroke-width='2'/><rect x='324' y='292' width='42' height='26' rx='6' fill='#7c3aed'/><text x='345' y='310' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='700' xml:space='preserve'>6</text><text x='376' y='310' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1b1b1b' text-anchor='start' font-weight='700' xml:space='preserve'>XFEAT</text><text x='338' y='338' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>keypoint + deskriptor</text><text x='338' y='355' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>BEKU, dilatih di MegaDepth</text><text x='338' y='372' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>belum pernah lihat penyu</text><text x='338' y='408' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#7c3aed' text-anchor='start' font-weight='600' xml:space='preserve'>mutual NN + cosine 0,82</text><path d='M 580 356 L 620 356' stroke='#6b6b6b' stroke-width='2' fill='none' marker-end='url(#p)'/><rect x='624' y='292' width='252' height='128' rx='10' fill='#ffffff' stroke='#7c3aed' stroke-width='2'/><rect x='
er, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='600' xml:space='preserve'>Jadi yang menolong adalah SKALA YANG SERAGAM antar foto, bukan jumlah piksel. Itu dua penjelasan yang berbeda.</text></svg>
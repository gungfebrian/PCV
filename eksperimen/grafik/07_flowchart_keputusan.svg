<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 560' width='1100' height='560' role='img' aria-label='Peta keputusan'><rect width='1100' height='560' fill='#ffffff'/><text x='24' y='34' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='21' fill='#1b1b1b' text-anchor='start' font-weight='700' xml:space='preserve'>Peta keputusan: penghambatnya sudah pindah</text><text x='24' y='56' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>Semua tuas di tahap 1 sudah habis dicoba. Yang tersisa ada di kualitas gambar dan matcher.</text><defs><marker id='q' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M 0 0 L 10 5 L 0 10 z' fill='#6b6b6b'/></marker></defs><rect x='24' y='84' width='320' height='150' rx='10' fill='#fef2f2' stroke='#b91c1c' stroke-width='2'/><text x='38' y='108' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#b91c1c' text-anchor='start' font-weight='700' xml:space='preserve'>SUDAH DICOBA — TAHAP 1</text><text x='38' y='130' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>alpha-QE            +0,60  tidak sig.</text><text x='38' y='146' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>database augment.   -0,60  tidak sig.</text><text x='38' y='162' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>CSLS hubness        +1,79  tidak sig.</text><text x='38' y='178' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>PCA-whitening       +0,60  tidak sig.</text><text x='38' y='194' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>k-reciprocal        -7,14  LEBIH BURUK</text><rect x='24' y='250' width='320' height='128' rx='10' fill='#fef2f2' stroke='#b91c1c' stroke-width='2'/><text x='38' y='274' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#b91c1c' text-anchor='start' font-weight='700' xml:space='preserve'>SUDAH DICOBA — SKOR</text><text x='38' y='296' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>inlier mentah       62,50  terbaik</text><text x='38' y='312' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>inlier / keypoint   61,90  seri</text><text x='38' y='328' font-family='SF Mono, Menlo, Consolas, monospace' font-size='10.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>inlier / pasangan   55,95  lebih buruk</text><rect x='24' y='394' width='320' height='118' rx='10' fill='#fef2f2' stroke='#b91c1c' stroke-width='2'/><text x='38' y='418' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#b91c1c' text-anchor='start' font-weight='700' xml:space='preserve'>SUDAH DICOBA — UKURAN &amp; k</text><text x='38' y='440' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>ukuran mendatar di 448-512</text><text x='38' y='456' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>k = 84 hanya +0,60 dari k = 50</text><text x='38' y='472' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>langit-langit sudah 100%</text><path d='M 352 300 L 412 300' stroke='#6b6b6b' stroke-width='2' marker-end='url(#q)'/><rect x='420' y='210' width='300' height='180' rx='10' fill='#fff7ed' stroke='#ea580c' stroke-width='2'/><text x='434' y='234' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#ea580c' text-anchor='start' font-weight='700' xml:space='preserve'>PENGHAMBAT SEKARANG</text><text x='434' y='256' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>Pada k = 84 langit-langitnya 100%,</text><text x='434' y='272' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>tapi hasilnya 75,60%.</text><text x='434' y='288' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'></text><text x='434' y='304' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>Jadi 24,4% query gagal karena</text><text x='434' y='320' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>XFEAT menaruh foto yang SALAH</text><text x='434' y='336' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>di atas yang benar - bukan karena</text><text x='434' y='352' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>kandidatnya tidak ikut terambil.</text><path d='M 728 300 L 788 300' stroke='#6b6b6b' stroke-width='2' marker-end='url(#q)'/><rect x='796' y='96' width='280' height='128' rx='10' fill='#f0fdf4' stroke='#15803d' stroke-width='2'/><text x='810' y='120' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#15803d' text-anchor='start' font-weight='700' xml:space='preserve'>TUAS 1 — GAMBAR</text><text x='810' y='142' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>YOLO deteksi kepala -&gt; crop</text><text x='810' y='158' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>menghapus pasir, tangan, karang</text><text x='810' y='174' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>yang ikut menghasilkan inlier palsu</text><text x='810' y='190' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'></text><text x='810' y='206' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>berlaku untuk foto lapangan</text><rect x='796' y='240' width='280' height='118' rx='10' fill='#f0fdf4' stroke='#15803d' stroke-width='2'/><text x='810' y='264' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#15803d' text-anchor='start' font-weight='700' xml:space='preserve'>TUAS 2 — MATCHER LAIN</text><text x='810' y='286' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>ALIKED, LoMa lewat vismatch</text><text x='810' y='302' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>RoMa dicoret: terlalu berat</text><text x='810' y='318' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>(1-3 detik per pasangan)</text><rect x='796' y='374' width='280' height='138' rx='10' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/><text x='810' y='398' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#2563eb' text-anchor='start' font-weight='700' xml:space='preserve'>TUAS 3 — LEBIH BANYAK DATA</text><text x='810' y='420' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>Zindi Turtle Recall:</text><text x='810' y='436' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>2.145 foto, 100 individu</text><text x='810' y='452' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>+ 10.658 foto, 2.231 individu</text><text x='810' y='468' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'></text><text x='810' y='484' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>TANPA tanggal - protokol split</text><text x='810' y='500' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='400' xml:space='preserve'>berbasis tahun tidak bisa dipakai</text><text x='24' y='544' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>Kotak merah = jalan buntu yang sudah terukur. Menjalankannya lagi tidak akan mengubah apa pun.</text></svg>
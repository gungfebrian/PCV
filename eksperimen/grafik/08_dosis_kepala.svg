apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#6b6b6b' text-anchor='end' font-weight='400' xml:space='preserve'>40%</text><line x1='96' y1='185.71428571428572' x2='756' y2='185.71428571428572' stroke='#d4d4d4'/><text x='84' y='189.71428571428572' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#6b6b6b' text-anchor='end' font-weight='400' xml:space='preserve'>50%</text><line x1='96' y1='142.85714285714283' x2='756' y2='142.85714285714283' stroke='#d4d4d4'/><text x='84' y='146.85714285714283' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#6b6b6b' text-anchor='end' font-weight='400' xml:space='preserve'>60%</text><line x1='96' y1='100.0' x2='756' y2='100.0' stroke='#d4d4d4'/><text x='84' y='104.0' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#6b6b6b' text-anchor='end' font-weight='400' xml:space='preserve'>70%</text><text x='134.9771260490112' y='422' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>2%</text><text x='295.0282641771753' y='422' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>5%</text><text x='416.1022762563282' y='422' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>10%</text><text x='576.1534143844924' y='422' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>25%</text><text x='697.2274264636452' y='422' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>50%</text><path d='M 139.29025572605516 346.42857142857144 L 256.0511381281641 308.92857142857144 L 434.33114035664926 250.0 L 576.1534143844924 164.28571428571422 L 710.9936020729212 126.78571428571433' stroke='#ea580c' stroke-width='3' fill='none'/><circle cx='710.9936020729212' cy='126.78571428571433' r='7' fill='#15803d'/><text x='710.9936020729212' y='110.78571428571433' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='700' xml:space='preserve'>63.75%</text><text x='710.9936020729212' y='446' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>crop ketat</text><text x='710.9936020729212' y='460' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>(margin 0,18x)</text><circle cx='576.1534143844924' cy='164.28571428571422' r='7' fill='#ea580c'/><text x='576.1534143844924' y='148.28571428571422' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='700' xml:space='preserve'>55.00%</text><text x='576.1534143844924' y='446' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>margin 0,5x</text><circle cx='434.33114035664926' cy='250.0' r='7' fill='#ea580c'/><text x='434.33114035664926' y='234.0' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='700' xml:space='preserve'>35.00%</text><text x='434.33114035664926' y='446' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>margin 1x</text><circle cx='256.0511381281641' cy='308.92857142857144' r='7' fill='#b91c1c'/><text x='256.0511381281641' y='292.92857142857144' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='700' xml:space='preserve'>21.25%</text><text x='256.0511381281641' y='446' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>margin 2x</text><circle cx='139.29025572605516' cy='346.42857142857144' r='7' fill='#b91c1c'/><text x='139.29025572605516' y='330.42857142857144' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='700' xml:space='preserve'>12.50%</text><text x='139.29025572605516' y='446' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>TANPA crop</text><text x='139.29025572605516' y='460' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='400' xml:space='preserve'>frame penuh</text><text x='426.0' y='494' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#6b6b6b' text-anchor='middle' font-weight='600' xml:space='preserve'>porsi kepala dari gambar yang masuk ke matcher (skala log)</text><rect x='96' y='100' width='301.69865188449364' height='300' rx='6' fill='rgba(0,0,0,0)' stroke='#b91c1c' stroke-width='1.5'/><text x='246.84932594224682' y='120' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#b91c1c' text-anchor='middle' font-weight='700' xml:space='preserve'>YOLO WAJIB</text><rect x='537.1762883354811' y='100' width='218.8237116645189' height='300' rx='6' fill='rgba(0,0,0,0)' stroke='#15803d' stroke-width='1.5'/><text x='646.5881441677406' y='120' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#15803d' text-anchor='middle' font-weight='700' xml:space='preserve'>YOLO TIDAK PERLU</text><text x='24' y='558' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1b1b1b' text-anchor='start' font-weight='700' xml:space='preserve'>Aturan yang bisa dipakai: kalau kepala mengisi &gt; 25% gambar, crop tidak menolong banyak. Di bawah 10%, akurasinya runtuh.</text><text x='24' y='580' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>Zakynthos median 2,05% -&gt; YOLO wajib. SeaTurtleIDHeads &amp; Zindi sudah berupa crop kepala -&gt; YOLO tidak perlu.</text><text x='24' y='602' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>ReunionTurtles foto sudah close-up (600x800) dan crop tengah 70% sudah diuji: tidak menolong. Jadi kemungkinan besar tidak perlu juga.</text></svg>
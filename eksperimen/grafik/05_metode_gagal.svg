, Arial, sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>tidak signifikan</text><text x='24' y='426' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>k-reciprocal rusak karena tiap individu hanya punya SATU foto galeri per sisi - tetangga terdekat sebuah foto galeri</text><text x='24' y='444' font-family='Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='400' xml:space='preserve'>selalu individu yang BERBEDA, jadi seluruh gagasan 'himpunan tetangga bersama' tidak punya bahan untuk bekerja.</text></svg>